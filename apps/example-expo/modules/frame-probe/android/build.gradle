plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.frameprobe'
version = '1.0.0'

android {
  namespace 'expo.modules.frameprobe'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // The library's version (android/build.gradle), so the app resolves one.
  implementation 'androidx.window:window:1.5.1'
  implementation 'androidx.window:window-java:1.5.1'
}
