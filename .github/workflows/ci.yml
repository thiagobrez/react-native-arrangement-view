name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Test hinge contract
        run: yarn test

      - name: Typecheck files
        run: yarn typecheck

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      - name: Pack package
        run: yarn pack --out "$RUNNER_TEMP/react-native-arrangement-view.tgz"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/react-native-arrangement-view.tgz
          if-no-files-found: error
          retention-days: 7

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Android example
        uses: ./.github/actions/build-android-example

  # iOS runs locally only: the hosted Mac runners can't run the iPhone Duo
  # simulator yet. See https://github.com/thiagobrez/react-native-arrangement-view/issues/23
  e2e-android:
    needs: build-android
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: example-android
          path: ${{ runner.temp }}

      - name: Run e2e tests on a Pixel 10 Pro Fold emulator
        uses: ./.github/actions/foldable-emulator
        with:
          apk: ${{ runner.temp }}/app-release.apk
          script: yarn example test:e2e:android --reporter list,junit

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android
          path: apps/example-expo/.e2e
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  build-ios:
    name: build-ios (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            xcode: '26'
            native-arrangement: false
          - runner: xcode-27
            xcode: '27.1'
            native-arrangement: true

    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Prebuild expo app for iOS
        run: |
          yarn example expo prebuild --platform ios

      - name: Build example for iOS
        run: |
          yarn example build:ios

      - name: Check native ArrangementView is compiled only with the iOS 27.1 SDK
        run: |
          library=apps/example-expo/ios/build/Build/Products/Debug-iphonesimulator/ArrangementView/libArrangementView.a
          native_only_symbol=SplitArrangementViewStyle
          test -f "$library"
          if nm -u "$library" | grep "$native_only_symbol" > /dev/null; then
            compiled=true
          else
            compiled=false
          fi

          if [[ $compiled != "${{ matrix.native-arrangement }}" ]]; then
            echo "::error::Native ArrangementView compiled: $compiled with the iOS $(xcrun --sdk iphoneos --show-sdk-version) SDK, expected ${{ matrix.native-arrangement }}"
            exit 1
          fi

  # Installs the tarball from build-library into a fresh Expo app outside the
  # monorepo, as an end user would, so nothing resolves through the workspace or src/.
  consumer:
    name: consumer (${{ matrix.platform }})
    needs: build-library
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: xcode-27
          - platform: android
            runner: ubuntu-latest

    env:
      APP_DIR: ${{ github.workspace }}/../consumer

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}

      - name: Create app on the example's Expo SDK
        run: |
          sdk=$(node -p "require('./apps/example-expo/package.json').dependencies.expo.match(/\d+/)[0]")
          npx --yes create-expo-app@latest "$APP_DIR" --template "blank-typescript@sdk-$sdk" --no-install

      - name: Install library from tarball
        working-directory: ${{ env.APP_DIR }}
        run: |
          cp "$GITHUB_WORKSPACE/.github/consumer/App.tsx" App.tsx
          npm install
          npm install "$RUNNER_TEMP/react-native-arrangement-view.tgz"
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json'));
            config.expo.ios.bundleIdentifier = 'arrangementview.consumer';
            config.expo.android.package = 'arrangementview.consumer';
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
          "

      - name: Typecheck
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit

      - name: Bundle JavaScript
        working-directory: ${{ env.APP_DIR }}
        run: npx expo export --platform ${{ matrix.platform }}

      - name: Use Xcode 27.1
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '27.1'

      - name: Install JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Finalize Android SDK
        if: matrix.platform == 'android'
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Prebuild
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform ${{ matrix.platform }}

      - name: Build for iOS
        if: matrix.platform == 'ios'
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcodebuild -workspace ios/consumer.xcworkspace -scheme consumer -configuration Debug -sdk iphonesimulator -derivedDataPath ios/build ONLY_ACTIVE_ARCH=YES -quiet

      - name: Build for Android
        if: matrix.platform == 'android'
        working-directory: ${{ env.APP_DIR }}/android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --build-cache --no-daemon --console=plain
