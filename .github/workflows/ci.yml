name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Picks the platforms a pull request can affect, so the native jobs for the
  # others are skipped. Pushes to main and the merge queue run both.
  changes:
    runs-on: ubuntu-latest

    outputs:
      ios: ${{ steps.platforms.outputs.ios }}
      android: ${{ steps.platforms.outputs.android }}
      platforms: ${{ steps.platforms.outputs.platforms }}

    steps:
      - name: Pick platforms from changed files
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ios=true
          android=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            ios=false
            android=false
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, .previous_filename // empty')
            while read -r file; do
              case "$file" in
                docs/* | tests/* | .changeset/* | .claude/* | *.md) ;;
                ios/* | *.podspec) ios=true ;;
                android/*) android=true ;;
                *)
                  ios=true
                  android=true
                  ;;
              esac
            done <<< "$files"
          fi

          platforms=$(jq -cn --argjson ios "$ios" --argjson android "$android" \
            '[if $ios then "ios" else empty end, if $android then "android" else empty end]')
          {
            echo "ios=$ios"
            echo "android=$android"
            echo "platforms=$platforms"
          } >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Test hinge contract
        run: yarn test

      - name: Typecheck files
        run: yarn typecheck

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      - name: Pack package
        run: yarn pack --out "$RUNNER_TEMP/react-native-arrangement-view.tgz"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/react-native-arrangement-view.tgz
          if-no-files-found: error
          retention-days: 7

  build-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Prebuild expo app for Android
        run: |
          yarn example expo prebuild --platform android

      - name: Build Release APK for the x86_64 e2e emulator, with the JS bundled
        working-directory: apps/example-expo/android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --build-cache --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-android
          path: apps/example-expo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # iOS runs locally only: the hosted Mac runners can't run the iPhone Duo
  # simulator yet. See https://github.com/thiagobrez/react-native-arrangement-view/issues/23
  e2e-android:
    needs: build-android
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      # The runner's command-line tools predate the Pixel 10 Pro Fold profile,
      # and the emulator action installs its own only when none exist. Delete
      # this step once the runner's tools are 21.0 or newer. See
      # https://github.com/thiagobrez/react-native-arrangement-view/issues/24
      - name: Update Android command-line tools
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  $RUNNER_TEMP/cmdline-tools.zip" | sha256sum -c
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: example-android
          path: ${{ runner.temp }}

      # The emulator stops when this step ends, so install and test in it.
      - name: Run e2e tests on a Pixel 10 Pro Fold emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_10_pro_fold
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # A slow emulator can show "System UI isn't responding" over the app.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell svc power stayon true
            adb install -r ${{ runner.temp }}/app-release.apk
            yarn example test:e2e:android --reporter list,junit

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android
          path: apps/example-expo/.e2e
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  build-ios:
    name: build-ios (Xcode ${{ matrix.xcode }})
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            xcode: '26'
            native-arrangement: false
          - runner: xcode-27
            xcode: '27.1'
            native-arrangement: true

    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Prebuild expo app for iOS
        run: |
          yarn example expo prebuild --platform ios

      - name: Build example for iOS
        run: |
          yarn example build:ios

      - name: Check native ArrangementView is compiled only with the iOS 27.1 SDK
        run: |
          library=apps/example-expo/ios/build/Build/Products/Debug-iphonesimulator/ArrangementView/libArrangementView.a
          native_only_symbol=SplitArrangementViewStyle
          test -f "$library"
          if nm -u "$library" | grep "$native_only_symbol" > /dev/null; then
            compiled=true
          else
            compiled=false
          fi

          if [[ $compiled != "${{ matrix.native-arrangement }}" ]]; then
            echo "::error::Native ArrangementView compiled: $compiled with the iOS $(xcrun --sdk iphoneos --show-sdk-version) SDK, expected ${{ matrix.native-arrangement }}"
            exit 1
          fi

  # Installs the tarball from build-library into a fresh Expo app outside the
  # monorepo, as an end user would, so nothing resolves through the workspace or src/.
  consumer:
    name: consumer (${{ matrix.platform }})
    needs: [build-library, changes]
    if: needs.changes.outputs.platforms != '[]'
    runs-on: ${{ matrix.platform == 'ios' && 'xcode-27' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.changes.outputs.platforms) }}

    env:
      APP_DIR: ${{ github.workspace }}/../consumer

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}

      - name: Create app on the example's Expo SDK
        run: |
          sdk=$(node -p "require('./apps/example-expo/package.json').dependencies.expo.match(/\d+/)[0]")
          npx --yes create-expo-app@latest "$APP_DIR" --template "blank-typescript@sdk-$sdk" --no-install

      - name: Install library from tarball
        working-directory: ${{ env.APP_DIR }}
        run: |
          cp "$GITHUB_WORKSPACE/.github/consumer/App.tsx" App.tsx
          npm install
          npm install "$RUNNER_TEMP/react-native-arrangement-view.tgz"
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json'));
            config.expo.ios.bundleIdentifier = 'arrangementview.consumer';
            config.expo.android.package = 'arrangementview.consumer';
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
          "

      - name: Typecheck
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit

      - name: Bundle JavaScript
        working-directory: ${{ env.APP_DIR }}
        run: npx expo export --platform ${{ matrix.platform }}

      - name: Use Xcode 27.1
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '27.1'

      - name: Install JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Finalize Android SDK
        if: matrix.platform == 'android'
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Prebuild
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform ${{ matrix.platform }}

      - name: Build for iOS
        if: matrix.platform == 'ios'
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcodebuild -workspace ios/consumer.xcworkspace -scheme consumer -configuration Debug -sdk iphonesimulator -derivedDataPath ios/build ONLY_ACTIVE_ARCH=YES -quiet

      - name: Build for Android
        if: matrix.platform == 'android'
        working-directory: ${{ env.APP_DIR }}/android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --build-cache --no-daemon --console=plain

  # The one check main requires. A skipped matrix job never reports its
  # expanded names, such as build-ios (Xcode 26), so requiring those would
  # leave them pending on a pull request that skips them.
  all-green:
    if: always()
    needs: [changes, lint, build-library, build-android, build-ios, consumer]
    runs-on: ubuntu-latest

    steps:
      - name: Fail if a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
