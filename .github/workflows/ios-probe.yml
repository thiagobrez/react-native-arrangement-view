# TEMPORARY diagnostic: does the xcode-27 runner starve because of the iPhone
# Duo, or would any simulator do it? Remove before merging.
name: iOS probe
on:
  pull_request:
    branches:
      - main

jobs:
  probe:
    name: probe (${{ matrix.device }})
    runs-on: xcode-27
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 18 Pro
            type: com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-27-0
          - device: iPhone Duo
            type: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-27-1

    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use Xcode 27.1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '27.1'

      - name: Runner hardware
        run: |
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          xcrun simctl list runtimes

      - name: Prebuild and build
        run: |
          yarn example expo prebuild --platform ios
          cd apps/example-expo
          xcodebuild -workspace ios/ArrangementViewExample.xcworkspace -scheme ArrangementViewExample \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build -quiet > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { tail -100 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Install the iOS 27.1 runtime
        if: matrix.runtime == 'com.apple.CoreSimulator.SimRuntime.iOS-27-1'
        timeout-minutes: 10
        run: |
          if ! xcrun simctl list runtimes -j | jq -e '.runtimes[] | select(.isAvailable and .identifier == "${{ matrix.runtime }}")' > /dev/null; then
            time xcodebuild -downloadPlatform iOS
          fi

      - name: Create, boot and install
        timeout-minutes: 15
        run: |
          UDID=$(xcrun simctl create probe "${{ matrix.type }}" "${{ matrix.runtime }}")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          SECONDS=0; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" > /dev/null; echo "boot: ${SECONDS}s"
          SECONDS=0; xcrun simctl install "$UDID" apps/example-expo/ios/build/Build/Products/Release-iphonesimulator/ArrangementViewExample.app; echo "install: ${SECONDS}s"
          SECONDS=0; xcrun simctl launch "$UDID" arrangementview.example; echo "launch: ${SECONDS}s"

      - name: Load while idle
        timeout-minutes: 5
        run: |
          for i in 1 2 3 4 5 6; do
            echo "--- $((i * 20))s"
            top -l 1 -n 8 -o cpu -stats pid,command,cpu,mem | sed -n '/^Load Avg/p;/^CPU usage/p;/^PhysMem/p;/^PID/,$p'
            sleep 20
          done

      - name: Prepare agent-device's iOS runner
        timeout-minutes: 15
        working-directory: apps/example-expo
        run: |
          SECONDS=0
          npx agent-device prepare ios-runner --platform ios --udid "$UDID" --timeout 600000
          echo "prepare: ${SECONDS}s"
          top -l 1 -n 0 | sed -n '/^Load Avg/p;/^CPU usage/p;/^PhysMem/p'

      - name: Snapshot through agent-device
        timeout-minutes: 5
        working-directory: apps/example-expo
        run: |
          SECONDS=0
          npx agent-device open arrangementview.example --platform ios --udid "$UDID"
          npx agent-device snapshot --platform ios --udid "$UDID" | head -20
          echo "open + snapshot: ${SECONDS}s"
          npx agent-device daemon stop
