name: E2E
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # The native ArrangementView and the iPhone Duo need Xcode 27.1.
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use Xcode 27.1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '27.1'

      - name: Prebuild expo app for iOS
        run: yarn example expo prebuild --platform ios

      # A Release build bundles the JavaScript, so no Metro server is needed.
      - name: Build example for the simulator
        working-directory: apps/example-expo
        run: |
          xcodebuild -workspace ios/ArrangementViewExample.xcworkspace -scheme ArrangementViewExample \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build -quiet > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { tail -100 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      # Only the iOS 27.1 runtime has the iPhone Duo, and the runner may not have it.
      - name: Install the iOS simulator runtime
        run: |
          if ! xcrun simctl list runtimes -j | jq -e '.runtimes[] | select(.isAvailable and any(.supportedDeviceTypes[]?; .name == "iPhone Duo"))' > /dev/null; then
            xcodebuild -downloadPlatform iOS
          fi

      - name: Boot an iPhone Duo and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone Duo")][0].udid // empty')
          if [[ -z $UDID ]]; then
            UDID=$(xcrun simctl create "iPhone Duo" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo)
          fi
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" apps/example-expo/ios/build/Build/Products/Release-iphonesimulator/ArrangementViewExample.app

      - name: Cache agent-device
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.agent-device
          key: ${{ runner.os }}-agent-device-xcode-27.1-${{ hashFiles('yarn.lock') }}

      # Builds and starts the XCTest runner agent-device drives the simulator
      # with, which can outlast e2e's launch budget on a cold runner.
      - name: Prepare the iOS runner
        working-directory: apps/example-expo
        run: |
          npx agent-device prepare ios-runner --platform ios --device "iPhone Duo" --timeout 900000
          npx agent-device daemon stop

      - name: Run e2e tests
        run: yarn example test:e2e:ios --reporter list,junit

      - name: Shut down the simulator
        if: ${{ !cancelled() }}
        run: xcrun simctl shutdown all

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios
          path: apps/example-expo/.e2e
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      # The runner's avdmanager predates the Pixel 10 Pro Fold profile.
      - name: Update Android command-line tools
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prebuild expo app for Android
        run: yarn example expo prebuild --platform android

      # A Release build bundles the JavaScript, so no Metro server is needed.
      - name: Build example for the emulator
        working-directory: apps/example-expo/android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain

      # The emulator stops when this step ends, so install and test in it.
      - name: Run e2e tests on a Pixel 10 Pro Fold emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_10_pro_fold
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apps/example-expo/android/app/build/outputs/apk/release/app-release.apk
            yarn example test:e2e:android --reporter list,junit

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android
          path: apps/example-expo/.e2e
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
