name: Foldable emulator
description: Boot a Pixel 10 Pro Fold emulator, install an APK on it, and run a script while it runs. The emulator stops when the script ends.

inputs:
  apk:
    description: Path to the APK to install
    required: true
  script:
    description: Commands to run on the booted emulator. The emulator runner runs each line as its own command, so keep a command on one line.
    required: true

runs:
  using: composite
  steps:
    - name: Install JDK
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: 'zulu'
        java-version: '17'

    # The runner's command-line tools predate the Pixel 10 Pro Fold profile,
    # and the emulator action installs its own only when none exist. Delete
    # this step once the runner's tools are 21.0 or newer. See
    # https://github.com/thiagobrez/react-native-arrangement-view/issues/24
    - name: Update Android command-line tools
      shell: bash
      run: |
        curl -sSfL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
        echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  $RUNNER_TEMP/cmdline-tools.zip" | sha256sum -c
        rm -rf "$ANDROID_HOME/cmdline-tools/latest"
        unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP"
        mv "$RUNNER_TEMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run on a Pixel 10 Pro Fold emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 36
        arch: x86_64
        target: google_apis
        profile: pixel_10_pro_fold
        cores: 4
        ram-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        disable-animations: true
        # A slow emulator can show "System UI isn't responding" over the app.
        script: |
          adb shell settings put global hide_error_dialogs 1
          adb shell svc power stayon true
          adb install -r ${{ inputs.apk }}
          ${{ inputs.script }}
